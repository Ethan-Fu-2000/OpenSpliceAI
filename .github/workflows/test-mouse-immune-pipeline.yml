name: Test mouse NCBI and IMGT pipeline

on:
  push:
    branches:
      - feat/imgt-splice-annotations
    paths:
      - ".github/workflows/test-mouse-immune-pipeline.yml"
      - "openspliceai/create_data/immune_splice.py"
      - "openspliceai/create_data/immune_training.py"
      - "openspliceai/train/train.py"
      - "scripts/prepare_mouse_immune_training.py"
      - "scripts/run_mouse_imgt_retraining.py"
      - "tests/unit/test_immune_splice.py"
      - "tests/unit/test_immune_training.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest h5py numpy

      - name: Compile changed Python files
        run: |
          python -m py_compile \
            openspliceai/create_data/immune_training.py \
            openspliceai/train/train.py \
            scripts/prepare_mouse_immune_training.py \
            scripts/run_mouse_imgt_retraining.py

      - name: Run immune pipeline unit tests
        run: |
          python -m pytest -q \
            tests/unit/test_immune_splice.py \
            tests/unit/test_immune_training.py
