name: Build mouse NCBI GENCODE and IMGT data release

on:
  push:
    branches:
      - feat/imgt-splice-annotations
    paths:
      - ".github/workflows/build-mouse-immune-data.yml"
      - "scripts/download_mouse_immune_training_data.py"
      - "scripts/download_mouse_immune_release.sh"
  workflow_dispatch:
    inputs:
      assembly:
        description: NCBI GRCm39 assembly accession
        required: true
        default: GCF_000001635.27
        type: string

permissions:
  contents: write

concurrency:
  group: mouse-strict-data-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6

      - name: Install NCBI Datasets CLI and zstd
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes zstd
          curl --fail --location --retry 5 \
            --output /tmp/datasets \
            "https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets"
          chmod +x /tmp/datasets
          sudo install /tmp/datasets /usr/local/bin/datasets
          datasets version

      - name: Download NCBI GRCm39 GENCODE M39 Basic and IMGT
        id: download
        shell: bash
        run: |
          set -euo pipefail
          ASSEMBLY="${{ github.event.inputs.assembly }}"
          if [[ -z "${ASSEMBLY}" ]]; then
            ASSEMBLY="GCF_000001635.27"
          fi
          echo "assembly=${ASSEMBLY}" >> "${GITHUB_OUTPUT}"
          python3 scripts/download_mouse_immune_training_data.py \
            --assembly "${ASSEMBLY}" \
            --output-dir data/mouse_immune

      - name: Package and split release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          find data/mouse_immune/ncbi -maxdepth 1 -type f -name "*.zip" -delete

          mkdir -p release
          cp data/mouse_immune/manifest.json release/manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("release/manifest.json").read_text())
          ncbi = manifest["ncbi"]
          gencode = manifest["gencode"]
          imgt = manifest["imgt"]
          lines = [
              "# 小鼠严格剪接训练参考数据",
              "",
              "本 Release 由 GitHub Actions 从官方来源自动生成。",
              "",
              f"- NCBI assembly: `{ncbi['assembly_accession']}` / `{ncbi['assembly_name']}`",
              f"- NCBI Datasets CLI: `{ncbi['datasets_cli_version']}`",
              f"- GENCODE: `{gencode['release']}` / `{gencode['assembly']}`",
              f"- GENCODE annotation: `{gencode['annotation_set']}`",
              f"- IMGT/GENE-DB release: `{imgt['gene_db_release']}`",
              f"- IMGT/LIGM-DB release: `{imgt['ligm_db_release']}`",
              f"- Downloaded at: `{manifest['downloaded_at_utc']}`",
              "",
              "数据政策：只使用 GRCm39；不做 liftOver；GENCODE 仅使用 M39 Basic。",
              "",
              "来源：",
              "- NCBI Datasets: https://www.ncbi.nlm.nih.gov/datasets/",
              "- GENCODE Mouse: https://www.gencodegenes.org/mouse/",
              "- IMGT: https://www.imgt.org/",
              "",
              "下载全部分卷后先校验 PARTS_SHA256SUMS，再合并并校验 ARCHIVE_SHA256SUM。",
              "",
          ]
          Path("release/DATA_PROVENANCE.md").write_text("\n".join(lines))
          PY

          tar --use-compress-program="zstd -T0 -3" \
            -cf release/mouse-immune-data.tar.zst \
            -C data mouse_immune

          (
            cd release
            sha256sum mouse-immune-data.tar.zst > ARCHIVE_SHA256SUM
            split -b 1900M -d -a 3 \
              --additional-suffix=.part \
              mouse-immune-data.tar.zst \
              mouse-immune-data.tar.zst.
            sha256sum mouse-immune-data.tar.zst.*.part > PARTS_SHA256SUMS
            rm mouse-immune-data.tar.zst
          )

          TAG="mouse-immune-data-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          cat > release/RELEASE_NOTES.md <<EOF
          Automated strict mouse splice-reference data package.

          Sources: NCBI GRCm39 + GENCODE M39 Basic + IMGT.
          Assembly: ${{ steps.download.outputs.assembly }}
          Source commit: ${GITHUB_SHA}

          Download all numbered archive parts plus checksum files.
          Use scripts/download_mouse_immune_release.sh to download, verify,
          join and extract the package.
          EOF

          ls -lh release

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.package.outputs.tag }}" \
            release/mouse-immune-data.tar.zst.*.part \
            release/PARTS_SHA256SUMS \
            release/ARCHIVE_SHA256SUM \
            release/manifest.json \
            release/DATA_PROVENANCE.md \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Mouse NCBI + GENCODE M39 Basic + IMGT data ${{ steps.package.outputs.tag }}" \
            --notes-file release/RELEASE_NOTES.md
